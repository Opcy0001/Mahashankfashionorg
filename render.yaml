# Render deployment config — free web service
# After deploying, add your custom domain in Render (Settings → Custom Domains)
# and point Hostinger DNS at the values Render shows you.
services:
  - type: web
    name: maha
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn mahashankh_chatbot.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "mahashankhfashion.org,www.mahashankhfashion.org,maha.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://mahashankhfashion.org,https://www.mahashankhfashion.org,https://maha.onrender.com"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: "https://mahashankhfashion.org,https://www.mahashankhfashion.org,https://maha.onrender.com"
      # Set this in the Render dashboard (Environment → Add) — do NOT put it in this file
      - key: MISTRAL_API_KEY
        sync: false
